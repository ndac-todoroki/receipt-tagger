# ジャンル定義【暫定】（docs/requirements.md §8）
# 大きく変えるときはユーザーに確認する

store_genres:
  - 飲食店
  - 交通
  - スーパー
  - コンビニ
  - ドラッグストア
  - 雑貨・ホームセンター
  - 医療
  - 公共料金・通信
  - 衣類・家電
  - その他

# 品目ジャンルは大分類→小分類の2段。家計簿で「食材を買って自炊したか、出来上がった物を
# 買ったか」を見分けられるように大分類を分ける。小分類の名前は全体で重ねない。
# 飲食店のレシートは品目ごとに判定せず、店ジャンル（=外食）でまとめる（genre_map.yaml）
item_categories:
  惣菜・弁当:
    - 惣菜・弁当
    - 菓子パン・サンドイッチ
  菓子:
    - 菓子・スナック
    - アイス・デザート
  食材:
    - 野菜・果物
    - 肉
    - 魚介
    - 卵・乳製品
    - 豆腐・納豆・大豆製品
    - 米・麺・食パン
    - 調味料・油
    - 冷凍食品
  飲み物:
    - 飲料
    - 酒類
  その他の食品:
    - その他の食品
  食品以外:
    - 日用消耗品
    - 化粧品・衛生
    - 医薬品
    - 文具・雑貨
    - 衣類
    - 家電・電池
    - ペット用品
    - ベビー用品
    - その他
