services:
  app:
    build:
      context: .
      dockerfile: inference/Dockerfile
    ports:
      # DGX Spark では 8000 を NIM が使っているため、ホスト側は既定で 8080 にする
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    restart: unless-stopped

  # 公開用。Cloudflare Zero Trust で作ったトンネルのトークンを .env に置いて
  # `docker compose --profile tunnel up -d` で起動する
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
    profiles: ["tunnel"]
